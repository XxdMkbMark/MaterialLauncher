name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: packageExe
            artifact: exe
          - os: windows-latest
            target: packageMsi
            artifact: msi

          # macOS (Intel + Apple Silicon)
          - os: macos-13          # Intel
            target: packageDmg
            artifact: dmg-intel
          - os: macos-14          # Apple Silicon
            target: packageDmg
            artifact: dmg-arm

          # Linux
          - os: ubuntu-latest
            target: packageDeb
            artifact: deb
          - os: ubuntu-latest
            target: packageRpm
            artifact: rpm
          - os: ubuntu-latest
            target: packageAppImage
            artifact: appimage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew :desktopApp:${{ matrix.target }} --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialLauncher-${{ matrix.artifact }}
          path: |
            desktopApp/build/compose/binaries/main/**/*.exe
            desktopApp/build/compose/binaries/main/**/*.msi
            desktopApp/build/compose/binaries/main/**/*.dmg
            desktopApp/build/compose/binaries/main/**/*.deb
            desktopApp/build/compose/binaries/main/**/*.rpm
            desktopApp/build/compose/binaries/main/**/*.AppImage
          if-no-files-found: warn